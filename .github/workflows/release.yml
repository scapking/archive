name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to build
        required: false
        default: main
        type: string
      publish:
        description: Publish the GitHub Release (requires a tag)
        required: false
        default: false
        type: boolean
      tag:
        description: Existing release tag (required when publishing)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  EXPO_NO_GIT_STATUS: "1"
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: --max-old-space-size=4096
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.ref || inputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 10.34.7
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          sdkmanager_bin="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" \
            "cmake;3.30.5" \
            "ndk;27.1.12297006"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/build-tools/37.0.0"
          test -d "$ANDROID_HOME/cmake/3.30.5"
          test -d "$ANDROID_HOME/ndk/27.1.12297006"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        if: github.event_name == 'push' || inputs.publish == true
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Invalid release tag: {tag!r}")
          PY

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --clean --no-install --skip-dependency-update expo,react-native

      - name: Build signed release APK
        working-directory: src/android
        env:
          NODE_ENV: production
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          keystore="$RUNNER_TEMP/archive-release.keystore"
          release_cert="$RUNNER_TEMP/release-cert-sha256.txt"
          cleanup() {
            rm -f "$keystore" "$release_cert"
          }
          trap cleanup EXIT

          : "${ANDROID_KEYSTORE_BASE64:?the release keystore secret is empty}"
          : "${ANDROID_KEYSTORE_PASSWORD:?the keystore password secret is empty}"
          : "${ANDROID_KEY_ALIAS:?the key alias secret is empty}"
          : "${ANDROID_KEY_PASSWORD:?the key password secret is empty}"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 0600 "$keystore"

          keytool -list -v \
            -keystore "$keystore" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            | sed -n 's/.*SHA256: //p' | head -n 1 > "$release_cert"
          test -s "$release_cert"

          python3 ../.github/scripts/configure-android-release-signing.py app/build.gradle

          ANDROID_RELEASE_STORE_FILE="$keystore" \
          ANDROID_RELEASE_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
          ANDROID_RELEASE_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
          ANDROID_RELEASE_KEY_PASSWORD="$ANDROID_KEY_PASSWORD" \
          ./gradlew --no-daemon --stacktrace :app:assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Verify the signed APK
        working-directory: src/android
        run: |
          set -eu
          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          apk="app/build/outputs/apk/release/app-release.apk"
          release_cert="$RUNNER_TEMP/release-cert-sha256.txt"
          test -s "$apk"
          test -s "$release_cert"

          verify_output="$("$build_tools/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$verify_output" | grep -F 'Verified using v2 scheme: true' >/dev/null
          if printf '%s\n' "$verify_output" | grep -F 'Verified using v3 scheme'; then
            printf '%s\n' "$verify_output" | grep -F 'Verified using v3 scheme: true' >/dev/null
          fi

          apk_cert="$(printf '%s\n' "$verify_output" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$apk_cert"
          test "$apk_cert" = "$(cat "$release_cert")"

          debug_cert="$(keytool -list -v -keystore app/debug.keystore -alias androiddebugkey -storepass android \
            | sed -n 's/.*SHA256: //p' | head -n 1)"
          test -n "$debug_cert"
          test "$apk_cert" != "$debug_cert"

          abis="$(unzip -Z1 "$apk" 'lib/*' | cut -d/ -f2 | sort -u)"
          test "$abis" = "arm64-v8a"

          app_version="$(python3 -c 'import json; print(json.load(open("../../src/app.json"))["expo"]["version"])')"
          version_code="$(python3 -c 'import json; print(json.load(open("../../src/app.json"))["expo"]["android"]["versionCode"])')"
          badging="$("$build_tools/aapt2" dump badging "$apk")"
          printf '%s\n' "$badging" | grep -F "package: name='com.anonymous.archive'" >/dev/null
          printf '%s\n' "$badging" | grep -F "versionName='$app_version'" >/dev/null
          printf '%s\n' "$badging" | grep -F "versionCode='$version_code'" >/dev/null

          size="$(stat -c %s "$apk")"
          test "$size" -gt 0
          test "$size" -le 125829120

      - name: Collect APK
        run: |
          version="$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["version"])')"
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk \
            "release-assets/archive-android-${version}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: src/release-assets/archive-android-*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.ref || inputs.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 10.34.7
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        if: github.event_name == 'push' || inputs.publish == true
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Invalid release tag: {tag!r}")
          PY

      - name: Generate iOS project
        run: pnpm exec expo prebuild --platform ios --clean --no-install --skip-dependency-update expo,react-native

      - name: Configure Xcode Node path
        run: printf 'export NODE_BINARY=%s\n' "$(command -v node)" > ios/.xcode.env.local

      - name: Install CocoaPods dependencies
        working-directory: src/ios
        run: pod install

      - name: Build unsigned iOS app
        working-directory: src/ios
        env:
          NODE_ENV: production
        run: |
          xcodebuild \
            -workspace Archive.xcworkspace \
            -scheme Archive \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          version="$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["version"])')"
          app_path="ios/build/Build/Products/Release-iphoneos/Archive.app"
          test -d "$app_path"
          test -f "$app_path/main.jsbundle"
          staging="$RUNNER_TEMP/archive-ipa"
          mkdir -p "$staging/Payload" release-assets
          ditto "$app_path" "$staging/Payload/Archive.app"
          (
            cd "$staging"
            zip -qry "$GITHUB_WORKSPACE/src/release-assets/archive-ios-${version}-unsigned.ipa" Payload
          )

      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa
          path: src/release-assets/archive-ios-*-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - android
      - ios
    if: github.event_name == 'push' || inputs.publish == true
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.ref || inputs.ref }}

      - name: Download Android APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: release-assets/android

      - name: Download unsigned iOS IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-ipa
          path: release-assets/ios

      - name: Validate version and assets
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import zipfile
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Invalid release tag: {tag!r}")
          app_version = json.loads(Path("src/app.json").read_text())["expo"]["version"]
          if tag != f"v{app_version}":
              raise SystemExit(
                  f"Tag {tag!r} does not match app version {app_version!r}"
              )

          android = list(Path("release-assets/android").glob("archive-android-*.apk"))
          ios = list(Path("release-assets/ios").glob("archive-ios-*-unsigned.ipa"))
          if len(android) != 1 or not android[0].stat().st_size:
              raise SystemExit(f"Expected one non-empty Android APK, found {android!r}")
          if len(ios) != 1 or not ios[0].stat().st_size:
              raise SystemExit(f"Expected one non-empty iOS IPA, found {ios!r}")
          if android[0].name != f"archive-android-{app_version}.apk":
              raise SystemExit(
                  f"Unexpected APK name {android[0].name!r} for version {app_version!r}"
              )
          if ios[0].name != f"archive-ios-{app_version}-unsigned.ipa":
              raise SystemExit(
                  f"Unexpected IPA name {ios[0].name!r} for version {app_version!r}"
              )

          def validate_archive(path, required_entries, require_lib_arm64=False):
              with zipfile.ZipFile(path) as archive:
                  corrupt_entry = archive.testzip()
                  if corrupt_entry is not None:
                      raise SystemExit(
                          f"Corrupt archive entry in {path}: {corrupt_entry}"
                      )
                  names = set(archive.namelist())
                  missing = sorted(set(required_entries) - names)
                  if missing:
                      raise SystemExit(f"Missing entries in {path}: {missing}")
                  if require_lib_arm64:
                      lib_abis = {
                          entry.split("/")[1]
                          for entry in names
                          if entry.startswith("lib/") and len(entry.split("/")) > 2
                      }
                      if lib_abis != {"arm64-v8a"}:
                          raise SystemExit(
                              "Expected arm64-v8a-only native libraries, "
                              f"found {sorted(lib_abis)!r}"
                          )

          validate_archive(
              android[0], {"AndroidManifest.xml", "classes.dex"}, require_lib_arm64=True
          )
          validate_archive(
              ios[0],
              {"Payload/Archive.app/Info.plist", "Payload/Archive.app/main.jsbundle"},
          )
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("src/app.json"))["expo"]["version"])')"
          android_asset="release-assets/android/archive-android-${version}.apk"
          ios_asset="release-assets/ios/archive-ios-${version}-unsigned.ipa"
          test -s "$android_asset"
          test -s "$ios_asset"
          gh release create "$RELEASE_TAG" \
            "$android_asset" \
            "$ios_asset" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "Archive $RELEASE_TAG" \
            --notes "Android APK: Release build, arm64-v8a only, signed with the configured Archive release key. iOS IPA: unsigned compile artifact; sign it with an Apple Distribution Certificate and provisioning profile before device installation or App Store distribution."
