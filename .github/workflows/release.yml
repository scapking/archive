name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "1"
  EXPO_NO_GIT_STATUS: "1"
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: --max-old-space-size=4096
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 10.34.7
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          sdkmanager_bin="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null 2>&1 || true
          "$sdkmanager_bin" \
            "cmake;3.30.5" \
            "ndk;27.1.12297006"
          test -d "$ANDROID_HOME/platforms/android-37.0"
          test -d "$ANDROID_HOME/build-tools/37.0.0"
          test -d "$ANDROID_HOME/cmake/3.30.5"
          test -d "$ANDROID_HOME/ndk/27.1.12297006"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Invalid release tag: {tag!r}")
          PY

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --clean --no-install --skip-dependency-update expo,react-native

      - name: Build release APK
        working-directory: src/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Collect APK
        run: |
          version="${RELEASE_TAG#v}"
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk \
            "release-assets/archive-android-${version}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: src/release-assets/archive-android-*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  ios:
    name: iOS unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}

      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 10.34.7
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        run: |
          python3 - <<'PY'
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Invalid release tag: {tag!r}")
          PY

      - name: Generate iOS project
        run: pnpm exec expo prebuild --platform ios --clean --no-install --skip-dependency-update expo,react-native

      - name: Configure Xcode Node path
        run: printf 'export NODE_BINARY=%s\n' "$(command -v node)" > ios/.xcode.env.local

      - name: Install CocoaPods dependencies
        working-directory: src/ios
        run: pod install

      - name: Build unsigned iOS app
        working-directory: src/ios
        env:
          NODE_ENV: production
        run: |
          xcodebuild \
            -workspace Archive.xcworkspace \
            -scheme Archive \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          version="${RELEASE_TAG#v}"
          app_path="ios/build/Build/Products/Release-iphoneos/Archive.app"
          test -d "$app_path"
          test -f "$app_path/main.jsbundle"
          staging="$RUNNER_TEMP/archive-ipa"
          mkdir -p "$staging/Payload" release-assets
          ditto "$app_path" "$staging/Payload/Archive.app"
          (
            cd "$staging"
            zip -qry "$GITHUB_WORKSPACE/src/release-assets/archive-ios-${version}-unsigned.ipa" Payload
          )

      - name: Upload unsigned iOS IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa
          path: src/release-assets/archive-ios-*-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs:
      - android
      - ios
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}

      - name: Download Android APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: release-assets/android

      - name: Download unsigned iOS IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ios-ipa
          path: release-assets/ios

      - name: Validate version and assets
        env:
          APP_VERSION: "1.0.0"
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys
          import zipfile
          from pathlib import Path

          def validate_archive(path, required_entries):
              with zipfile.ZipFile(path) as archive:
                  corrupt_entry = archive.testzip()
                  if corrupt_entry is not None:
                      raise SystemExit(
                          f"Corrupt archive entry in {path}: {corrupt_entry}"
                      )
                  names = set(archive.namelist())
                  missing = sorted(set(required_entries) - names)
                  if missing:
                      raise SystemExit(f"Missing entries in {path}: {missing}")

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              raise SystemExit(f"Invalid release tag: {tag!r}")
          app_version = json.loads(Path("src/app.json").read_text())["expo"]["version"]
          if tag != f"v{app_version}":
              raise SystemExit(
                  f"Tag {tag!r} does not match app version {app_version!r}"
              )
          android = list(Path("release-assets/android").glob("archive-android-*.apk"))
          ios = list(Path("release-assets/ios").glob("archive-ios-*-unsigned.ipa"))
          if len(android) != 1 or not android[0].stat().st_size:
              raise SystemExit(f"Expected one non-empty Android APK, found {android!r}")
          if len(ios) != 1 or not ios[0].stat().st_size:
              raise SystemExit(f"Expected one non-empty iOS IPA, found {ios!r}")
          validate_archive(android[0], {"AndroidManifest.xml", "classes.dex"})
          validate_archive(
              ios[0],
              {"Payload/Archive.app/Info.plist", "Payload/Archive.app/main.jsbundle"},
          )
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          android_asset="release-assets/android/archive-android-${version}.apk"
          ios_asset="release-assets/ios/archive-ios-${version}-unsigned.ipa"
          test -s "$android_asset"
          test -s "$ios_asset"
          gh release create "$RELEASE_TAG" \
            "$android_asset" \
            "$ios_asset" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --latest \
            --title "Archive $RELEASE_TAG" \
            --notes "Android APK: internal release signed with the Expo debug key. iOS IPA: unsigned compile artifact; sign it before device installation or App Store distribution."
