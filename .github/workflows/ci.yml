name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"
  EXPO_NO_GIT_STATUS: "1"
  EXPO_NO_TELEMETRY: "1"
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    name: Typecheck and export
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
        with:
          version: 10.34.7
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and contract tests
        run: pnpm test

      - name: Brand assets check
        run: pnpm assets:check

      - name: Release metadata test
        run: node --test ../tests/release-metadata.test.ts

      - name: Android signing transformer tests
        working-directory: .
        run: python3 -m unittest discover -s tests -p 'test_configure_android_release_signing.py' -v

      - name: Release workflow contract test
        working-directory: .
        run: python3 -m unittest discover -s tests -p 'test_release_workflow.py' -v

      - name: Scan tracked files for credential patterns
        working-directory: .
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path

          listing = subprocess.run(
              ["git", "ls-files", "-z"], capture_output=True, check=True
          ).stdout
          findings = []
          patterns = [
              ("private key block", re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----")),
              (
                  "inline base64 blob",
                  re.compile(r"^[A-Za-z0-9+/]{512,}={0,2}$", re.M),
              ),
          ]
          for raw_name in listing.split(b"\0"):
              if not raw_name:
                  continue
              name = raw_name.decode("utf-8", "surrogateescape")
              path = Path(name)
              if not path.is_file():
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for label, pattern in patterns:
                  if pattern.search(content):
                      findings.append(f"{name}: {label}")
          if findings:
              print("Credential patterns found:", file=sys.stderr)
              print("\n".join(findings), file=sys.stderr)
              raise SystemExit(1)
          PY

      - name: Verify generated web CSS
        run: |
          pnpm web:css
          git diff --exit-code -- public/nativewind.css

      - name: Export production web bundle
        env:
          NODE_ENV: production
        run: pnpm exec expo export --platform web --output-dir dist
